<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis cursos</title>
    <link rel="stylesheet" href="../Estilos/styles-header-footer.css">
<link rel="stylesheet" href="../Estilos/styles.css">
</head>
<body>
 <header id="header-contenedor" class="header-principal"></header>
<main>

    <section class="cabecera-cursos">
        <h1>Mis Cursos</h1>
        <p>Accedé a tus clases activas y materiales de estudio.</p>
    </section>

    <section class="listado-cursos">

        <article class="tarjeta curso" data-id="css-html">
            <div class="portada-curso">
                <img src="../imagenes/Programacion/Html-Css.jpg" alt="Logo de HTML5 y CSS3">
            </div>
            <div class="tarjeta-cuerpo">
                <h2>HTML5 y CSS3 desde Cero</h2>
                <p class="descripcion-curso">Aprendé a maquetar sitios web modernos.</p>
                <div class="botones-curso">
                    <a href="../Cursos/css-html.html" class="boton-curso">Ir al curso</a>
                </div>
            </div>
        </article>

        <article class="tarjeta curso" data-id="javascript">
            <div class="portada-curso">
                <img src="../imagenes/Programacion/JavaScript.jpg" alt="Logo de JavaScript">
            </div>
            <div class="tarjeta-cuerpo">
                <h2>JavaScript Moderno</h2>
                <p class="descripcion-curso">Dominá el lenguaje esencial de la web.</p>
                <div class="botones-curso">
                    <a href="../Cursos/javascript.html" class="boton-curso">Ir al curso</a>
                </div>
            </div>
        </article>

    </section>

</main>
<footer id="footer-contenedor" class="footer-principal"></footer>

<script src="/Scripts/cargaComponentes.js"></script>
</body>
</html>
