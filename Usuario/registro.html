<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../Estilos/styles-header-footer.css">
    <link rel="stylesheet" href="../Estilos/styleForm.css">
</head>
<body>
    <header id="header-contenedor" class="header-principal"></header>
<main>

    <h1>Registrate</h1>

    <!--<a href="" class="boton-google">Inciar sesion con Google</a>-->
      <!-- lo dejo para luego crear un inicio de sesion y registro con google -->
       
    <form  action="#" method="POST" class="formulario-registro" novalidate>
    <section class="informacion-personal">

 <div class="contenedor-input-form">

     <label for="nombre-apellido">Nombre y Apellido:</label>
     <p id ="error-Nombre"></p>
     <input class = "ipt-form" type="text" id="nombre-apellido" name="nombre-apellido" placeholder="Ej: Gabriel Edgardo Panik">
</div>
    

      
     <label for="email">E-mail:</label>
      <div class="contenedor-input-form">
        <p id ="error-Email"></p>
      <input id ="imput-Email" class = "ipt-form" type="email" id="email" name="email"  placeholder="Ej: thomaslepez777@gmail.com">
      </div>
                               <!-- value para en el futuro poder tomar el dato para js-->
    


        <div class="campo-genero">
    <p class="titulo-genero"> Genero:</p>
    <div class="campo-genero-radio">                             
     <input type="radio" id="masculino" name="genero"  value="masculino" >
     <label for="masculino">Masculino</label>
                                                                <!-- value para en el futuro poder tomar el dato para js-->
      <input type="radio" id="femenino" name="genero"  value="femenino" >
     <label for="femenino">Femenino</label>
                                                            <!-- value para en el futuro poder tomar el dato para js-->                                                  
    <input type="radio" id="no-definido" name="genero"  value="no-definido">
     <label for="no-definido">Prefiero no decirlo</label>
    </div>
    </div>
     
    
    <label for="dni">DNI:</label>
    <div class="contenedor-input-form">
    <p id ="error-DNI"></p>
    <input class = "ipt-form"type="text" id="dni" name="dni"  placeholder="Ej: 11000777" inputmode="numeric">
    <!-- accesibilidad al usar inputmode (en celulares se abre el teclado numerico) -->
    </div>


    <label for="fecha-nacimiento">Fecha de nacimiento:</label>
    <div id = "form-fecha" class="contenedor-input-form">
        <p id = "error-fecha"></p>
        <input class ="ipt-form" type="date" id="fecha-nacimiento" name="fecha-nacimiento" max="2026-12-31" >
    </div>
    
   
   
      <label for="contraseña">Contraseña</label>
    <div class="contenedor-input-form">
        <p id ="error-password" class="imput-error" ></p>
        <img id = "candado" class="icono-input" src="../svg's/Iconos-SVG/whide/candado.svg" alt="Icono de candado">
        <input class = "ipt-form" type="password" id="password" name="contraseña" placeholder="Ingrese su contraseña" >
        <img id ="ojo" class="icono-input-ojo" src="../svg's/Iconos-SVG/whide/no-ojo.svg" alt="Icono de ojo">
    </div>
    
    <button type="submit" class="boton">Crear cuenta</button>

    <p class="texto-login">
        ¿Ya tenés cuenta? <a href="iniciar-sesion.html">Iniciá sesión</a>
      </p>
       </section>
</form>
</main>
<footer id="footer-contenedor" class="footer-principal"></footer>

<script src="/Scripts/cargaComponentes.js"></script>
<script src="../Scripts/form.js"></script>
</body>
</html>
