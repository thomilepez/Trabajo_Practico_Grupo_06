<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <header></header>
<main>

    <h1>Registrate</h1>

     
    <a href="" class="boton-google">Inciar sesion con Google</a>
    <br>
    <br>

    <form action="#" method="POST" class="formulario-registro"></form>
    <section class="informacion-personal">

   <div class="campo">
    <label for="nombre-apellido">Nombre y Apellido:</label>
    <input type="text" id="nombre-apellido" name="nombre-apellido" required placeholder="Ej: Gabriel Edgardo Panik">
    </div>   

    <div class="campo">           
     <label for="email">E-mail:</label>
     <input type="email" id="email" name="email" required placeholder="Ej: thomaslepez777@gmail.com">
                                    <!-- value para en el futuro poder tomar el dato para js-->
        </div>


        <div class="campo-genero">
<p class="titulo-genero"> Genero:</p>
    <div class="campo-genero-radio">                             
     <input type="radio" id="masculino" name="genero"  value="masculino" required>
     <label for="masculino">Masculino</label>
                                                                <!-- value para en el futuro poder tomar el dato para js-->
      <input type="radio" id="femenino" name="genero"  value="femenino" required>
     <label for="femenino">Femenino</label>
                                                            <!-- value para en el futuro poder tomar el dato para js-->                                                  
    <input type="radio" id="no-definido" name="genero"  value="no-definido" required>
     <label for="no-definido">Prefiero no decirlo</label>
    </div>
    </div>
     
<div class="campo">
<label for="dni">DNI:</label>
     <input type="text" id="dni" name="dni" required placeholder="Ej: 11000777" inputmode="numeric">
                                                     <!-- accesibilidad al usar inputmode (en celulares se abre el teclado numerico) -->
        </div>
<div class="campo">
        <label for="fecha-nacimiento">Fecha de nacimiento:</label>
        <input 
          type="date" id="fecha-nacimiento" name="fecha-nacimiento" max="2026-12-31" required>
    </div>
   
   
<div class="campo">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required >
      </div> 
    
    <button type="submit" class="boton">Crear cuenta</button>

    <p class="texto-login">
        ¿Ya tenés cuenta? <a href="iniciar-sesion.html">Iniciá sesión</a>
      </p>
       </section>
</form>
</main>
    <footer></footer>
</body>
</html>
