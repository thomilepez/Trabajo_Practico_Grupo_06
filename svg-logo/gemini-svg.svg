<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Icono Central -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <!-- Birrete (Rombo / Tapa) -->
    <polygon points="250,90 345,138 250,174 155,138" fill="#1877F2" stroke-width="15"/>
    <polygon points="250,90 345,138 250,174 155,138" fill="none" stroke-width="15"/>
    
    <!-- Borla / Tassel -->
    <line x1="330" y1="146" x2="330" y2="176" stroke-width="8"/>
    <rect x="320" y="166" width="20" height="44" rx="10" fill="#ffffff" stroke="none"/>

    <!-- Cabeza -->
    <circle cx="250" cy="195" r="48" fill="#1877F2" stroke-width="15"/>

    <!-- Base del Libro y Manos -->
    <path d="M 250 282 
             C 285 262, 310 252, 324 246 
             A 6 6 0 0 1 328 253 
             L 338 280 
             A 28 28 0 1 1 350 326 
             L 255 350 
             A 12 12 0 0 1 245 350 
             L 150 326 
             A 28 28 0 1 1 162 280 
             L 172 253 
             A 6 6 0 0 1 176 246 
             C 190 252, 215 262, 250 282 Z" 
          fill="#ffffff" stroke="none"/>

    <!-- Lomo y separación de páginas del libro -->
    <path d="M 175 254 C 205 270, 230 277, 250 286 C 270 277, 295 270, 325 254" 
          fill="none" stroke="#1877F2" stroke-width="8" stroke-linecap="round"/>
    <line x1="250" y1="288" x2="250" y2="345" stroke="#1877F2" stroke-width="8"/>
    
    <!-- Aberturas de las manos -->
    <circle cx="166" cy="305" r="15" fill="#1877F2" stroke="none"/>
    <circle cx="334" cy="305" r="15" fill="#1877F2" stroke="none"/>
  </g>

  <!-- Texto Cambiado a E-STUDY -->
  <text x="250" y="415" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="4">
    E-STUDY
  </text>
</svg>
